services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /app/data/prooftrail.db
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - prooftrail-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  prooftrail-data:
